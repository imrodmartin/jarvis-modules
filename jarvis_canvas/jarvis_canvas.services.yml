services:
  jarvis_canvas.overlay_alpha:
    class: Drupal\jarvis_canvas\OverlayAlpha
    arguments:
      - '@cache.default'

  jarvis_canvas.twig_extension:
    class: Drupal\jarvis_canvas\JarvisCanvasTwigExtension
    arguments:
      - '@entity_type.manager'
      - '@file_url_generator'
      - '@renderer'
      - '@file_system'
      - '@jarvis_canvas.overlay_alpha'
    tags:
      - { name: twig.extension }

  # Share image (og:image / twitter:image): hero banner, else first body
  # image, else the site logo. Every Jarvis site, by rule.
  jarvis_canvas.share_image_subscriber:
    class: Drupal\jarvis_canvas\ShareImageSubscriber
    arguments:
      - '@router.admin_context'
    tags:
      - { name: event_subscriber }
